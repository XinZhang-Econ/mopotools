server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    # Cache static assets (Quartz JS/CSS are content-hashed)
    location ~* \.(js|css|png|jpg|svg|woff2|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML pages — shorter cache so wiki updates propagate quickly
    location ~* \.html$ {
        expires 10m;
        add_header Cache-Control "public, must-revalidate";
    }

    # Quartz uses clean URLs — try the .html file if path has no extension
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
