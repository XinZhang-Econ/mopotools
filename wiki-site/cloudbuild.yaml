# Cloud Build trigger — fires on every push to main that touches wiki/ or wiki-site/
# Rebuilds the Quartz static site and redeploys to Cloud Run.

steps:
  # 1. Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    id: "build-image"
    args:
      - build
      - --file=wiki-site/Dockerfile
      - --tag=gcr.io/$PROJECT_ID/mopotools-wiki:$COMMIT_SHA
      - --tag=gcr.io/$PROJECT_ID/mopotools-wiki:latest
      - --cache-from=gcr.io/$PROJECT_ID/mopotools-wiki:latest
      - .

  # 2. Push to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    id: "push-image"
    args:
      - push
      - --all-tags
      - gcr.io/$PROJECT_ID/mopotools-wiki
    waitFor: ["build-image"]

  # 3. Deploy to Cloud Run
  - name: "gcr.io/cloud-builders/gcloud"
    id: "deploy"
    args:
      - run
      - deploy
      - mopotools-wiki
      - --image=gcr.io/$PROJECT_ID/mopotools-wiki:$COMMIT_SHA
      - --region=europe-west1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5
    waitFor: ["push-image"]

# Build timeout (Quartz build can take a few minutes)
timeout: "600s"

options:
  logging: CLOUD_LOGGING_ONLY

# Only rebuild on changes to wiki content or site config
# (configured in the Cloud Build trigger filter, not here)
